# ATRI's normal-chat runtime. This composition intentionally has no filesystem,
# shell, web, subagent, session-query, or cross-channel messaging tools.

- id: sdk-jsonrpc-server
  name: './plugins/atri-sdk-jsonrpc-server/index.js'
  config:
    maxTokensAsSuccess: false

- id: llm
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      atri-gateway:
        displayName: ATRI configured gateway
        apiKeyEnv: OPENAI_API_KEY
        api: openai-completions
        baseURL: !!js process.env.OPENAI_BASE_URL ?? 'http://127.0.0.1:1/v1'
        defaultInput: [text, image]
        streamIdleTimeoutMs: !!js Number(process.env.OPENAI_TIMEOUT ?? 180) * 1000
        retryPolicy:
          mode: normal
          # ATRI owns the single bounded replay and global backoff. Provider
          # retries here would multiply one turn into a burst of requests.
          maxRetries: 0
        models:
          - id: !!js process.env.OPENAI_MODEL ?? 'unconfigured-model'
            # This is provider capability metadata used by pi-ai's post-response
            # overflow detector. It must not be confused with ATRI's preferred
            # memory target (ATRI_DSH_CONTEXT_WINDOW), otherwise a valid large
            # response can be rejected locally after the upstream accepted it.
            contextWindow: !!js Number(process.env.ATRI_DSH_PROVIDER_CONTEXT_WINDOW ?? 1048576)

- id: llm-retry
  name: '@deepseek-ai/dsh-llm-retry'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: true
    persona: !!js process.env.ATRI_DSH_SYSTEM_PROMPT ?? 'You are ATRI, a helpful Discord participant.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false
    maxParallelToolCalls: 1

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
  config:
    thresholdChars: 8000
    headChars: 5000
    tailChars: 1500

- id: compaction
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    # Keep compaction at 78% of ATRI's 140k-style memory target even though the
    # provider capability descriptor may be much larger (for Gemini, 1M).
    thresholdRatio: !!js Math.min(0.95, Math.max(0.01, (Number(process.env.ATRI_DSH_CONTEXT_WINDOW ?? 140000) * 0.78) / Number(process.env.ATRI_DSH_PROVIDER_CONTEXT_WINDOW ?? 1048576)))
    retainTokens: !!js Math.floor(Number(process.env.ATRI_DSH_CONTEXT_WINDOW ?? 140000) * 0.2)
    maxTokens: 30000
    compactionRetries: 1
    maxOverflowRetries: 1
    auto: true

- id: atri-tools
  name: './plugins/atri-tools/index.js'

- id: atri-native-plugins
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: './native-plugins.json'
    initial: []
